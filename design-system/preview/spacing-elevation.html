<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card-frame">
<div class="eyebrow">Elevation · DS v1.1 — flat, hairline borders</div>
<div style="display:flex; gap:18px; margin-top:12px;">
 <div style="flex:1; background:var(--wt-surface); border:1px solid var(--wt-border); border-radius:2px; padding:14px;">
  <div style="font-size:11px; font-weight:600; letter-spacing:0.10em; text-transform:uppercase; color:var(--wt-ink-muted)">Card · resting</div>
  <div style="font-family:var(--wt-font-mono); font-size:10px; color:var(--wt-stone-gray); margin-top:8px; line-height:1.6">background: #1C1C1C<br>border: 1px solid #2E2E2E<br>no blur, no shadow</div>
 </div>
 <div style="flex:1; background:var(--wt-surface); border:1px solid var(--wt-accent); border-radius:2px; padding:14px;">
  <div style="font-size:11px; font-weight:600; letter-spacing:0.10em; text-transform:uppercase; color:var(--wt-ink-muted)">Card · active / focus</div>
  <div style="font-family:var(--wt-font-mono); font-size:10px; color:var(--wt-stone-gray); margin-top:8px; line-height:1.6">border-color: var(--wt-accent)<br>elevation via border, not shadow</div>
 </div>
 <div style="flex:1; background:var(--wt-surface-2); border:1px solid var(--wt-border); border-radius:2px; padding:14px;">
  <div style="font-size:11px; font-weight:600; letter-spacing:0.10em; text-transform:uppercase; color:var(--wt-ink-muted)">Surface 2</div>
  <div style="font-family:var(--wt-font-mono); font-size:10px; color:var(--wt-stone-gray); margin-top:8px; line-height:1.6">background: #2E2E2E<br>for secondary surfaces</div>
 </div>
</div></div></body></html>

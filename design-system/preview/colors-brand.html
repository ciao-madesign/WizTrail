<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.swatch { flex:1; min-width:90px; border-radius:10px; padding:14px 12px; border:1px solid color-mix(in oklab, var(--wt-border) 70%, transparent); display:flex; flex-direction:column; gap:4px; }
.swatch .dot { width:100%; height:56px; border-radius:6px; margin-bottom:8px; }
.swatch .name { font-size:12px; font-weight:600; color:var(--wt-ink); }
.swatch .hex { font-family:var(--wt-font-mono); font-size:10.5px; color:var(--wt-muted); }
</style></head><body><div class="card-frame">
<div class="eyebrow">Brand · Teal accent</div>
<div class="row">
 <div class="swatch"><div class="dot" style="background:#4fd1c5"></div><div class="name">Teal</div><div class="hex">#4FD1C5</div></div>
 <div class="swatch"><div class="dot" style="background:#81e6d9"></div><div class="name">Teal 200</div><div class="hex">#81E6D9</div></div>
 <div class="swatch"><div class="dot" style="background:#2a9d8f"></div><div class="name">Teal 700</div><div class="hex">#2A9D8F</div></div>
 <div class="swatch"><div class="dot" style="background:#002b2b"></div><div class="name">Teal deep</div><div class="hex">#002B2B</div></div>
</div>
</div></body></html>

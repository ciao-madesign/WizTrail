<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.swatch { flex:1; min-width:90px; border-radius:2px; padding:12px; border:1px solid color-mix(in oklab, var(--wt-border) 70%, transparent); display:flex; flex-direction:column; gap:4px; }
.swatch .dot { width:100%; height:52px; border-radius:2px; margin-bottom:6px; border:1px solid rgba(255,255,255,0.06); }
.swatch .name { font-size:11.5px; font-weight:600; }
.swatch .hex { font-family:var(--wt-font-mono); font-size:10px; color:var(--wt-ink-muted); }
</style></head><body><div class="card-frame">
<div class="eyebrow">Neutrals · DS v1.1 (ACG-inspired)</div>
<div class="row">
 <div class="swatch"><div class="dot" style="background:#111111"></div><div class="name">black</div><div class="hex">#111111</div></div>
 <div class="swatch"><div class="dot" style="background:#1C1C1C"></div><div class="name">off-black</div><div class="hex">#1C1C1C</div></div>
 <div class="swatch"><div class="dot" style="background:#2E2E2E"></div><div class="name">charcoal</div><div class="hex">#2E2E2E</div></div>
 <div class="swatch"><div class="dot" style="background:#6A6A6A"></div><div class="name">stone-gray</div><div class="hex">#6A6A6A</div></div>
 <div class="swatch"><div class="dot" style="background:#C8C8C8"></div><div class="name">fog</div><div class="hex">#C8C8C8</div></div>
 <div class="swatch"><div class="dot" style="background:#F3F2F0"></div><div class="name">chalk</div><div class="hex">#F3F2F0</div></div>
</div>
</div></body></html>

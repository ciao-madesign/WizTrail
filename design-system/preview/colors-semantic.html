<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.swatch { flex:1; min-width:110px; border-radius:2px; padding:12px; border:1px solid color-mix(in oklab,var(--wt-border) 70%, transparent); }
.swatch .dot { width:100%; height:46px; border-radius:6px; margin-bottom:8px; }
.swatch .name { font-size:11.5px; font-weight:600; }
.swatch .hex { font-family:var(--wt-font-mono); font-size:10px; color:var(--wt-ink-muted); margin-top:2px; }
.swatch .use { font-size:10px; color:var(--wt-stone-gray); margin-top:4px; }
</style></head><body><div class="card-frame">
<div class="eyebrow">Semantic signals</div>
<div class="row">
 <div class="swatch"><div class="dot" style="background:#B8D400"></div><div class="name">accent</div><div class="hex">#B8D400</div><div class="use">Primary / CTA</div></div>
 <div class="swatch"><div class="dot" style="background:#34A853"></div><div class="name">ok</div><div class="hex">#34A853</div><div class="use">Under / better</div></div>
 <div class="swatch"><div class="dot" style="background:#ffb020"></div><div class="name">warn</div><div class="hex">#FFB020</div><div class="use">Tips · caution</div></div>
 <div class="swatch"><div class="dot" style="background:#ff6b6b"></div><div class="name">error</div><div class="hex">#FF6B6B</div><div class="use">Over / slower</div></div>
</div>
</div></body></html>

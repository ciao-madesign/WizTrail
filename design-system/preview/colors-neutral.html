<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.swatch { flex:1; min-width:90px; border-radius:10px; padding:12px; border:1px solid color-mix(in oklab, var(--wt-border) 70%, transparent); display:flex; flex-direction:column; gap:4px; }
.swatch .dot { width:100%; height:52px; border-radius:6px; margin-bottom:6px; border:1px solid rgba(255,255,255,0.06); }
.swatch .name { font-size:11.5px; font-weight:600; }
.swatch .hex { font-family:var(--wt-font-mono); font-size:10px; color:var(--wt-muted); }
</style></head><body><div class="card-frame">
<div class="eyebrow">Neutrals · Ink scale</div>
<div class="row">
 <div class="swatch"><div class="dot" style="background:#0a0f14"></div><div class="name">bg</div><div class="hex">#0A0F14</div></div>
 <div class="swatch"><div class="dot" style="background:#0f151c"></div><div class="name">panel</div><div class="hex">#0F151C</div></div>
 <div class="swatch"><div class="dot" style="background:#121a22"></div><div class="name">card</div><div class="hex">#121A22</div></div>
 <div class="swatch"><div class="dot" style="background:#2a394d"></div><div class="name">border</div><div class="hex">#2A394D</div></div>
 <div class="swatch"><div class="dot" style="background:#5a6b7f"></div><div class="name">faint</div><div class="hex">#5A6B7F</div></div>
 <div class="swatch"><div class="dot" style="background:#a8b3c2"></div><div class="name">muted</div><div class="hex">#A8B3C2</div></div>
 <div class="swatch"><div class="dot" style="background:#e8f2ff"></div><div class="name">ink</div><div class="hex">#E8F2FF</div></div>
</div>
</div></body></html>

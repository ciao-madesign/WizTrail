<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Strava non ancora disponibile — WizTrail</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="wiztrail.css?v=20261118">
  <script src="features.js?v=20261118"></script>
  <meta name="theme-color" content="#002b2b">
</head>
<body data-theme="dark" style="font-family:system-ui;padding:40px 20px;text-align:center;">

  <div id="stravaUnavail" role="status" style="max-width:520px;margin:0 auto;">
    <h1 style="font-size:1.4rem;">Strava non ancora disponibile</h1>
    <p>Il collegamento con Strava non è al momento disponibile. Puoi comunque analizzare la tua attività: scarica il file GPX e caricalo nel Calcolatore.</p>
    <p><a class="btn" href="index.html">Vai al Calcolatore</a> <a class="btn secondary" href="training-analyzer.html">Vai al Training Analyzer</a></p>
  </div>
  <p id="status" hidden>Connessione a Strava in corso…</p>

  <script>
    (async function () {
      // Strava spenta (WizFeatures.stravaEnabled=false): pagina statica, nessuna richiesta e nessun redirect silenzioso
      if (!WizFeatures.stravaEnabled) return;
      document.getElementById('stravaUnavail').hidden = true;
      document.getElementById('status').hidden = false;
      const params      = new URLSearchParams(location.search);
      const code        = params.get('code');
      const state       = params.get('state');
      const storedState = sessionStorage.getItem('strava_oauth_state');
      sessionStorage.removeItem('strava_oauth_state');
      const status = document.getElementById('status');

      // Nessun code → redirect silenzioso
      if (!code) {
        status.textContent = 'Parametro mancante. Reindirizzamento…';
        setTimeout(() => { location.href = 'training-analyzer.html'; }, 1500);
        return;
      }

      // CSRF check: state deve coincidere con quello generato al login
      if (!state || !storedState || state !== storedState) {
        status.textContent = 'Errore di sicurezza. Reindirizzamento…';
        setTimeout(() => { location.href = 'training-analyzer.html'; }, 1500);
        return;
      }

      try {
        const res  = await fetch('/api/strava/callback?code=' + encodeURIComponent(code));
        const data = await res.json();

        if (!res.ok || !data.access_token) {
          status.textContent = 'Autenticazione non riuscita. Reindirizzamento…';
          setTimeout(() => { location.href = 'training-analyzer.html'; }, 2000);
          return;
        }

        // Salva token e vai all'import
        sessionStorage.setItem('strava_token', data.access_token);
        if (data.athlete_id) {
          sessionStorage.setItem('strava_athlete_id', String(data.athlete_id));
        }

        location.href = 'import_strava.html';

      } catch (err) {
        status.textContent = 'Errore di rete. Reindirizzamento…';
        setTimeout(() => { location.href = 'training-analyzer.html'; }, 2000);
      }
    })();
  </script>
</body>
</html>

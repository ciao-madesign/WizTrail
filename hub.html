<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WizTrail Hub — Calibrazione</title>
  <meta name="robots" content="noindex, nofollow"/>
  <style>
    /* ── Variabili ─────────────────────────────────────────────────────── */
    :root {
      --bg:       #0d1117;
      --bg2:      #161b22;
      --bg3:      #21262d;
      --border:   #30363d;
      --accent:   #4fd1c5;
      --accent2:  #2d9e94;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --green:    #3fb950;
      --orange:   #d29922;
      --red:      #f85149;
      --radius:   10px;
      --font:     'DM Mono', 'Fira Code', 'Courier New', monospace;
      --font-ui:  system-ui, -apple-system, sans-serif;
    }

    /* ── Reset & Base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    input, select, textarea {
      font-family: var(--font-ui);
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 12px;
      width: 100%;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    label { font-size: 0.82rem; color: var(--muted); display: block; margin-bottom: 5px; }

    /* ── Layout ────────────────────────────────────────────────────────── */
    .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
    }
    .header-inner {
      display: flex; align-items: center;
      justify-content: space-between;
      max-width: 900px; margin: 0 auto; padding: 0 20px;
    }
    .logo {
      font-family: var(--font);
      font-size: 1rem;
      color: var(--accent);
      letter-spacing: 0.08em;
    }
    .logo span { color: var(--muted); }
    .badge {
      font-family: var(--font);
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .badge.admin { border-color: var(--accent); color: var(--accent); }

    /* ── Tabs ──────────────────────────────────────────────────────────── */
    .tabs {
      display: flex; gap: 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px; margin-top: 24px;
    }
    .tab {
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-family: var(--font-ui); font-size: 0.88rem;
      padding: 10px 16px;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Panels ────────────────────────────────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

    /* ── Cards ─────────────────────────────────────────────────────────── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-family: var(--font);
      font-size: 0.78rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ── Form ──────────────────────────────────────────────────────────── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid.full { grid-template-columns: 1fr; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 4px; }

    /* ── Bottoni ────────────────────────────────────────────────────────── */
    .btn {
      font-family: var(--font-ui);
      font-size: 0.88rem;
      padding: 9px 18px;
      border-radius: 6px;
      border: none; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      font-weight: 500;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-secondary {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-sm { font-size: 0.78rem; padding: 5px 12px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Slider tecnicità ───────────────────────────────────────────────── */
    .slider-wrap { position: relative; }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      height: 4px; background: var(--bg3);
      border-radius: 2px; border: none; padding: 0;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .slider-labels {
      display: flex; justify-content: space-between;
      font-size: 0.7rem; color: var(--muted);
      margin-top: 4px;
    }
    .tech-value {
      font-family: var(--font);
      font-size: 1.2rem; color: var(--accent);
      font-weight: bold; margin-bottom: 6px;
    }

    /* ── Preview validation ─────────────────────────────────────────────── */
    .preview-box {
      background: var(--bg3);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px; margin: 16px 0;
    }
    .preview-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; margin-bottom: 14px;
    }
    .kpi-mini { text-align: center; }
    .kpi-mini .val {
      font-family: var(--font);
      font-size: 1.4rem; color: var(--accent);
      font-weight: bold; display: block;
    }
    .kpi-mini .lbl {
      font-size: 0.72rem; color: var(--muted);
    }
    canvas#elevPreview {
      width: 100%; height: 90px;
      border-radius: 6px;
      background: var(--bg);
    }

    /* ── Lista attività ──────────────────────────────────────────────────── */
    .activity-list { display: flex; flex-direction: column; gap: 10px; }
    .activity-item {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px; align-items: center;
    }
    .activity-name { font-weight: 500; font-size: 0.92rem; }
    .activity-meta { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
    .status-badge {
      font-family: var(--font);
      font-size: 0.68rem;
      padding: 3px 8px; border-radius: 20px;
      border: 1px solid;
    }
    .status-badge.pending  { color: var(--orange); border-color: var(--orange); }
    .status-badge.done     { color: var(--green);  border-color: var(--green);  }
    .status-badge.excluded { color: var(--muted);  border-color: var(--border); }

    /* ── Stats dashboard ────────────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px; text-align: center;
    }
    .stat-val {
      font-family: var(--font);
      font-size: 1.6rem; color: var(--accent);
      font-weight: bold; display: block;
    }
    .stat-lbl { font-size: 0.75rem; color: var(--muted); }

    /* ── Spinner ────────────────────────────────────────────────────────── */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Messages ───────────────────────────────────────────────────────── */
    .msg {
      font-size: 0.82rem; padding: 8px 12px;
      border-radius: 6px; margin: 8px 0;
      display: none;
    }
    .msg.show { display: block; }
    .msg.success { background: rgba(63,185,80,0.1); color: var(--green); border: 1px solid var(--green); }
    .msg.error   { background: rgba(248,81,73,0.1);  color: var(--red);   border: 1px solid var(--red);   }
    .msg.info    { background: rgba(79,209,197,0.1); color: var(--accent); border: 1px solid var(--accent); }

    /* ── Progress bar ───────────────────────────────────────────────────── */
    .progress-wrap {
      background: var(--bg3); border-radius: 4px;
      height: 6px; margin: 8px 0;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%; background: var(--accent);
      border-radius: 4px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ── Lock screen ─────────────────────────────────────────────────────── */
    #lockScreen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .lock-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      width: 340px; text-align: center;
    }
    .lock-logo {
      font-family: var(--font);
      font-size: 1.2rem; color: var(--accent);
      margin-bottom: 4px;
    }
    .lock-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 24px; }
    #lockKeyForm { display: none; margin-top: 16px; }
    #lockKeyForm input {
      width: 100%; box-sizing: border-box;
      padding: 8px 10px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 0.82rem; margin-bottom: 8px;
    }
    #lockKeyForm input:focus { outline: none; border-color: var(--accent); }
    #lockKeyForm button {
      width: 100%; padding: 9px; border-radius: var(--radius);
      background: var(--accent); color: #111; font-weight: 700;
      border: none; cursor: pointer; font-size: 0.9rem;
    }
  </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha384-rRoXxn2yHlrZYB587Ki9RO1tONhLdM6XfORg7Rw4uwH4/Fh/5nP7IUX91bkaKUgs" crossorigin="anonymous"></script>
</head>
<body>

<!-- ── Lock screen (visibile finché non si verifica il token) ────────────── -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-logo">WizTrail<span style="color:var(--muted);">.hub</span></div>
    <div class="lock-sub">Calibrazione algoritmo</div>
    <div id="lockMsg" style="font-size:0.82rem; color:var(--muted); margin-bottom:12px;">
      Verifica accesso in corso...
    </div>
    <div id="lockSpinner" class="spinner"></div>
    <form id="lockKeyForm" onsubmit="submitKey(event)">
      <input id="lockKeyInput" type="password" placeholder="Incolla il tuo token di accesso" autocomplete="off" />
      <button type="submit">Accedi</button>
    </form>
  </div>
</div>

<!-- ── App (nascosta finché il token non è verificato) ────────────────────── -->
<div id="app" style="display:none;">

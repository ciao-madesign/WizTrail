<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card-frame">
<div class="eyebrow">Form · Inputs</div>
<div style="display:flex; flex-direction:column; gap:10px; margin-top:6px;">
<div>
 <label style="display:block; font-weight:600; font-size:12.5px; margin-bottom:4px">Tempo 10 km in piano</label>
 <input value="50:00" style="width:100%; background:color-mix(in oklab, var(--wt-panel) 75%, transparent); color:var(--wt-ink); border:1px solid color-mix(in oklab, var(--wt-border) 75%, transparent); border-radius:10px; padding:8px 10px; font-family:var(--wt-font-mono); font-size:14px">
</div>
<div>
 <label style="display:block; font-weight:600; font-size:12.5px; margin-bottom:4px">Distanza (km) <span style="color:var(--wt-muted); font-weight:400">· focused</span></label>
 <input value="21.097" style="width:100%; background:color-mix(in oklab, var(--wt-panel) 75%, transparent); color:var(--wt-ink); border:1px solid var(--wt-teal); border-radius:10px; padding:8px 10px; font-family:var(--wt-font-mono); font-size:14px; outline:none; box-shadow:0 0 0 3px color-mix(in oklab, var(--wt-teal) 20%, transparent)">
</div>
<div style="display:flex; gap:10px;">
 <select style="flex:1; background:color-mix(in oklab, var(--wt-panel) 75%, transparent); color:var(--wt-ink); border:1px solid color-mix(in oklab, var(--wt-border) 75%, transparent); border-radius:10px; padding:8px 10px; font-family:var(--wt-font-sans); font-size:14px"><option>Caldo</option></select>
 <select style="flex:1; background:color-mix(in oklab, var(--wt-panel) 75%, transparent); color:var(--wt-ink); border:1px solid color-mix(in oklab, var(--wt-border) 75%, transparent); border-radius:10px; padding:8px 10px; font-family:var(--wt-font-sans); font-size:14px"><option>1000–1500 m</option></select>
</div>
</div></div></body></html>

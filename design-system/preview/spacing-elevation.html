<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card-frame">
<div class="eyebrow">Elevation · shadow + glass</div>
<div style="display:flex; gap:18px; margin-top:4px;">
 <div style="flex:1; background:color-mix(in oklab,var(--wt-card) 68%, transparent); backdrop-filter:blur(12px) saturate(130%); border:1px solid color-mix(in oklab,var(--wt-border) 70%, transparent); border-radius:12px; padding:14px; box-shadow:0 8px 28px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.04) inset">
  <div style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--wt-muted)">Card · resting</div>
  <div style="font-family:var(--wt-font-mono); font-size:10px; color:var(--wt-faint); margin-top:8px; line-height:1.6">0 8px 28px rgba(0,0,0,.18)<br>+ inset hairline highlight<br>+ backdrop-filter blur(12px)</div>
 </div>
 <div style="flex:1; background:color-mix(in oklab,var(--wt-card) 74%, transparent); backdrop-filter:blur(12px) saturate(130%); border:1px solid color-mix(in oklab,var(--wt-border) 70%, transparent); border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.25); transform:translateY(-2px)">
  <div style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--wt-muted)">Card · hover</div>
  <div style="font-family:var(--wt-font-mono); font-size:10px; color:var(--wt-faint); margin-top:8px; line-height:1.6">0 10px 24px rgba(0,0,0,.25)<br>+ translateY(-2px)</div>
 </div>
 <div style="flex:1; background:color-mix(in oklab,var(--wt-card) 78%, transparent); border:1px solid color-mix(in oklab,var(--wt-border) 70%, transparent); border-radius:10px; padding:14px; box-shadow:0 6px 16px rgba(0,0,0,.15)">
  <div style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--wt-muted)">Floating banner</div>
  <div style="font-family:var(--wt-font-mono); font-size:10px; color:var(--wt-faint); margin-top:8px; line-height:1.6">0 6px 16px rgba(0,0,0,.15)</div>
 </div>
</div></div></body></html>
